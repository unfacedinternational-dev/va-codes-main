name: Capture real project thumbnails

on:
  push:
    paths:
      - ".capture-project-thumbnails"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture live project pages
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const projects = [
            ['maharlika-philippines.png', 'https://ismex-philippines.vercel.app'],
            ['va-codes.png', 'https://va-codes.vercel.app/'],
            ['joy-n-collective.png', 'https://joy-n-collective.vercel.app/'],
            ['my-pet-shop-online.png', 'https://unfacedinternational-dev.github.io/My-petshoponline/'],
            ['makeup.png', 'https://unfacedinternational-dev.github.io/makeup/'],
            ['master-reference-sheet.png', 'https://unfacedinternational-dev.github.io/Master-Reference-Sheet/'],
            ['va-profile-portfolio.png', 'https://my-va-profile-portfolio.vercel.app/'],
            ['legal-va-portfolio.png', 'https://joy-n-portfolioprofile-legalva.vercel.app'],
            ['medical-va-automation.png', 'https://medical-va-automation-system-5oas.vercel.app'],
            ['real-estate-va-portfolio.png', 'https://joy-n-portfolioprofile-realestateva.vercel.app']
          ];

          (async () => {
            fs.mkdirSync('assets/project-thumbnails', { recursive: true });
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1
            });

            for (const [file, url] of projects) {
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await page.waitForTimeout(3000);
              } catch (error) {
                console.log('Navigation warning:', url, error.message);
              }

              try {
                await page.screenshot({
                  path: 'assets/project-thumbnails/' + file,
                  type: 'png'
                });
                console.log('Captured:', file);
              } catch (error) {
                console.log('Screenshot failed:', url, error.message);
              }
            }

            await browser.close();
          })();
          NODE

      - name: Commit real thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add assets/project-thumbnails/*.png
          git rm -f .capture-project-thumbnails .github/workflows/capture-project-thumbnails.yml
          git commit -m "Add real project screenshots as portfolio thumbnails" || exit 0
          git push
