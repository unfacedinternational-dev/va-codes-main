Arial" font-size="17" font-weight="700" fill="#d4af37">▣ Time &amp; Audit Tracking</text><text x="1220" y="782" font-family="Arial" font-size="14" fill="#94a3b8">Tracks billable work, system activity,</text><text x="1220" y="805" font-family="Arial" font-size="14" fill="#94a3b8">and workflow audit events.</text><text x="800" y="938" text-anchor="middle" font-family="Arial" font-size="11" letter-spacing="1.5" fill="#64748b">LEXIFLOW • LEGAL VA &amp; ATTORNEY AUTOMATION SUITE</text></svg>